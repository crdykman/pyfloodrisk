[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfloodrisk"
version = "0.3.0"
description = "Flood Risk Assessment Workflow for GR4H-Based Design Flood Analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ze Jiang", email = "ze.jiang@unsw.edu.au" },
    { name = "Caleb Dykman", email = "caleb.dykman@unsw.edu.au" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "numba>=0.57",
    "spotpy>=1.5",
    "seaborn>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
# Copula and KDE methods for sampling the initial state distribution
# (pyfloodrisk.dffa.states); the default bootstrap method needs none of it.
copula = ["pyvinecopulib>=0.6"]

[project.urls]
Repository = "https://github.com/crdykman/pyfloodrisk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"pyfloodrisk.data" = ["**/*"]

# "**/*" above would otherwise sweep up compiled bytecode left in the source
# tree, which is interpreter-version specific and has no business in a wheel.
[tool.setuptools.exclude-package-data]
"pyfloodrisk.data" = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]